[project]
name = "iracing-ai-cinematic-studio"
version = "0.1.0"
description = "AI-powered replay director and video editor: iRacing races → cinematic social content"
requires-python = ">=3.11"
dependencies = [
    "pyirsdk>=1.3.5",       # SDK oficial: telemetría + control del replay (verificado)
    "pydantic>=2.7",        # modelos de dominio / contratos IA
    "PyYAML>=6.0",          # session string del SDK
    "keyring>=25.0",        # claves API en Windows Credential Manager
    "httpx>=0.27",          # clientes IA OpenAI-compat (MVP 1+)
]
# MVP 2+: opencv-python, ultralytics (tracking reframe)
# MVP 3+: -

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
gui = [
    "pyside6>=6.7",         # UI (se instala con: uv sync --group gui)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ai", "engines", "services", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
